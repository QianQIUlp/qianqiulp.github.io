name: Build both Astro sites

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  room:
    name: Build Qiu's Room
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  developer:
    name: Build developer profile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: developer/package-lock.json
      - run: npm ci
      - run: npm run build
