  <style>
    body {

    .page {

      margin: 0;
      font-size: clamp(2rem, 4vw, 2.8rem);

    }

    .lead {
      margin: 10px 0 0;
      color: #5f6b7a;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: #0366d6;
      text-decoration: none;
      white-space: nowrap;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .post-grid {
      margin-top: 16px;
    }

    @media (max-width: 640px) {
      .page {
        padding: 24px 16px 40px;
      }
