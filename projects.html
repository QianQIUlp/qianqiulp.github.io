  <script>
    (function(){
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta name="description" content="Qiu 的小屋 · 作品集，展示正在进行的探索、学习项目与未来计划。">

  <!-- 一个项目 = 一个 .project 块。复制粘贴这块就能加新项目 -->

  <div class="project project--padded">

    <div class="project-tags">
      <span class="tag">学习</span>
      <span class="tag">进行中</span>

  <div class="project project--padded">
    <h2 class="project-heading">📊 统计理论笔记</h2>
    <div class="project-tags">
      <span class="tag">学习</span>
      <span class="tag">已完成</span>
    </div>
    <p class="project-desc-nomg">系统整理概率论与数理统计的核心概念与推导。</p>
  </div>

  <div class="project project--padded-last">
    <h2 class="project-heading">☕ 慢思与折腾</h2>
    <div class="project-tags">
      <span class="tag">想法</span>
    </div>
    <p class="project-desc-nomg">占位。有些想法正在酝酿，慢慢折腾，随心呈现。</p>
  </div>

  <script>
    (function(){
      var btn = document.getElementById('themeToggle');
      var html = document.documentElement;
      var isDark = html.getAttribute('data-theme') === 'dark';
      btn.textContent = isDark ? '☀️' : '🌙';

      btn.addEventListener('click', function(){
        var dark = html.getAttribute('data-theme') === 'dark';
        if (dark) {
          html.removeAttribute('data-theme');
          btn.textContent = '🌙';
          localStorage.setItem('theme', 'light');
        } else {
          html.setAttribute('data-theme', 'dark');
          btn.textContent = '☀️';
          localStorage.setItem('theme', 'dark');
        }
      });
    })();
  </script>

</body>
