	<!-- 一个项目 = 一个 .project 块。复制粘贴这块就能加新项目 -->

	<div class="project">
		<h2>📘 GitHub Learning 计划</h2>

		<p>4 周从零搭建 GitHub 工作流，产出这个个人网站。</p>

	<div class="project">

	<div class="project">

		<span class="tag">想法</span>
		<p>（占位 · 想到再填）</p>
	</div>

	<script>
	  const btn = document.getElementById('themeToggle');
	  const html = document.documentElement;
	  const isDark = localStorage.getItem('theme') === 'dark';
	  if (isDark) { html.setAttribute('data-theme', 'dark'); btn.textContent = '☀️'; }

	  btn.addEventListener('click', () => {
	    const dark = html.getAttribute('data-theme') === 'dark';
	    html.setAttribute('data-theme', dark ? '' : 'dark');
	    btn.textContent = dark ? '🌙' : '☀️';
	    localStorage.setItem('theme', dark ? 'light' : 'dark');
	  });
	</script>
