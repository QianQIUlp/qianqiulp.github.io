<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qianqiulp · 个人主页</title>
<style>
  /* ===== CSS 变量：主色调 #2d3436（深炭灰），强调色 #0984e3（明亮蓝） ===== */
  :root {
    --bg: #ffffff;
    --text: #2d3436;
    --text-secondary: #636e72;
    --accent: #0984e3;
    --card-bg: #f8f9fa;
    --card-border: #e9ecef;
    --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
  }

  /* ===== 深色模式变量覆盖 ===== */
  [data-theme="dark"] {
    --bg: #1a1a2e;
    --text: #dfe6e9;
    --text-secondary: #b2bec3;
    --accent: #74b9ff;
    --card-bg: #16213e;
    --card-border: #0f3460;
    --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
  }

  /* ===== 全局重置 ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ===== 页面基础样式 ===== */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.3s, color 0.3s;
  }

  /* ===== 主题切换按钮 ===== */
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    z-index: 100;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

  /* ===== 主容器：居中 + 最大宽度 ===== */
  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 80px 24px 40px;
    flex: 1;
  }

  /* ===== 头部区域 ===== */
  .header { text-align: center; margin-bottom: 56px; }
  .header h1 {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .header .tagline {
    font-size: 1.05rem;
    color: var(--text-secondary);
    font-weight: 400;
  }

  /* ===== 卡片网格 ===== */
  .cards { display: flex; flex-direction: column; gap: 20px; margin-bottom: 56px; }

  /* ===== 单张卡片 ===== */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 28px 24px;
    box-shadow: var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  .card h2 {
    font-size: 1.15rem;
    margin-bottom: 10px;
    color: var(--accent);
    font-weight: 600;
  }
  .card p { font-size: 0.95rem; color: var(--text-secondary); }
  .contact-list {
    list-style: none;
    display: grid;
    gap: 10px;
    margin-top: 8px;
  }
  .contact-list li {
    font-size: 0.95rem;
    color: var(--text-secondary);
  }
  .contact-list a {
    color: var(--accent);
    text-decoration: none;
  }
  .contact-list a:hover { text-decoration: underline; }

  /* ===== 页脚 ===== */
  .footer {
    text-align: center;
    padding: 24px;
    font-size: 0.85rem;
    color: var(--text-secondary);
    border-top: 1px solid var(--card-border);
  }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  /* ===== 移动端适配 ===== */
  @media (max-width: 480px) {
    .container { padding: 60px 16px 32px; }
    .header h1 { font-size: 1.8rem; }
    .card { padding: 20px 16px; }
  }
</style>
</head>
<body>

<!-- 主题切换按钮 -->
<button class="theme-toggle" id="themeToggle" aria-label="切换深浅色模式" title="切换深浅色模式">🌙</button>

<!-- 主容器 -->
<main class="container">

  <!-- 头部 -->
  <header class="header">
    <h1>qianqiulp</h1>
    <p class="tagline">🧑‍💻 一个在学编程、喜欢折腾的开发者</p>
  </header>

  <!-- 卡片区 -->
  <section class="cards">

    <div class="card">
      <h2>📋 关于我</h2>
      <p>我是千秋，也喜欢你们直接叫我qiu/秋。我现在是大二的计算机学生，喜欢二次元，电吉他和前沿技术。</p>
    </div>

    <div class="card">
      <h2>📚 在学什么</h2>
      <p>现在在学习github和git的使用</p>
    </div>

    <div class="card">
      <h2>📬 联系方式</h2>
      <ul class="contact-list">
        <li>Bilibili：<a href="https://space.bilibili.com/400485069?spm_id_from=333.33.0.0" target="_blank" rel="noopener">space.bilibili.com/400485069</a></li>
        <li>GitHub：<a href="https://github.com/qianqiulp" target="_blank" rel="noopener">github.com/qianqiulp</a></li>
      </ul>
    </div>

  </section>

</main>

<!-- 页脚 -->
<footer class="footer">
  <p>© 2026 qianqiulp &nbsp;·&nbsp;
    <a href="https://github.com/qianqiulp" target="_blank" rel="noopener">github.com/qianqiulp</a>
  </p>
</footer>

<script>
  /* 深浅色模式切换（不超过 20 行） */
  const btn = document.getElementById('themeToggle');
  const html = document.documentElement;
  const isDark = localStorage.getItem('theme') === 'dark';
  if (isDark) { html.setAttribute('data-theme', 'dark'); btn.textContent = '☀️'; }

  btn.addEventListener('click', () => {
    const dark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', dark ? '' : 'dark');
    btn.textContent = dark ? '🌙' : '☀️';
    localStorage.setItem('theme', dark ? 'light' : 'dark');
  });
</script>

</body>
</html>
