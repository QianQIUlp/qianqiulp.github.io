<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="style.css">

<body class="page-home">

<!-- 主题切换按钮 -->
<button class="theme-toggle" id="themeToggle" aria-label="切换深浅色模式" title="切换深浅色模式">🌙</button>

<!-- 主容器 -->
<main class="container">

  <!-- 头部 -->
  <header class="header">
    <h1>qianqiulp</h1>
    <p class="tagline">🧑‍💻 一个在学编程、喜欢折腾的开发者</p>
  </header>

  <!-- 卡片区 -->
  <section class="cards">

    <div class="card">
      <h2>📋 关于我</h2>
      <p>我是千秋，也喜欢你们直接叫我qiu/秋。我现在是大二的计算机学生，喜欢二次元，电吉他和前沿技术。</p>
    </div>

    <div class="card">
      <h2>📚 在学什么</h2>
      <p>现在在学习github和git的使用</p>
    </div>

    <div class="card cta-card">
      <h2>📝 我的博客</h2>
      <p>记录技术实践、学习笔记和一些个人随想。</p>
      <p><a class="cta-button" href="blog/index.html">去看看博客 →</a></p>
    </div>

    <div class="card cta-card">
      <h2>🚀 我的作品</h2>
      <p><a class="cta-button" href="projects.html">看看我的作品 →</a></p>
    </div>

    <div class="card">
      <h2>📬 联系方式</h2>
      <ul class="contact-list">
        <li>Bilibili：<a href="https://space.bilibili.com/400485069?spm_id_from=333.33.0.0" target="_blank" rel="noopener">space.bilibili.com/400485069</a></li>
        <li>GitHub：<a href="https://github.com/qianqiulp" target="_blank" rel="noopener">github.com/qianqiulp</a></li>
      </ul>
    </div>

  </section>

</main>

<!-- 页脚 -->
<footer class="footer">
  <p>© 2026 qianqiulp &nbsp;·&nbsp;
    <a href="https://github.com/qianqiulp" target="_blank" rel="noopener">github.com/qianqiulp</a>
  </p>
</footer>

<script>
  /* 深浅色模式切换（不超过 20 行） */
  const btn = document.getElementById('themeToggle');
  const html = document.documentElement;
  const isDark = localStorage.getItem('theme') === 'dark';
  if (isDark) { html.setAttribute('data-theme', 'dark'); btn.textContent = '☀️'; }

  btn.addEventListener('click', () => {
    const dark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', dark ? '' : 'dark');
    btn.textContent = dark ? '🌙' : '☀️';
    localStorage.setItem('theme', dark ? 'light' : 'dark');
  });
</script>

</body>
</html>
